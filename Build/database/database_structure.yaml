      registered_member_id: { C# Short Single: Id, type: ID }
      registered_member_password_hash: { C# Short Single: PasswordHash, type: HASH }
      registered_member_phone_number: { C# Short Single: PhoneNumber, type: VARCHAR, size: 13 }
