
replacements:

  column:
  - - { type: ID }
    - { type: INT }
  - - { type: INDEX }
    - { type: INT }
  - - { type: ENUM }
    - { type: TINYINT }
  - - { type: BOOL }
    - { type: BIT }
  - - { type: NAME }
    - { type: VARCHAR, size: (2**8)-1 }
  - - { type: HASH }
    - { type: VARCHAR, size: (2**8)-1 }
  - - { type: TITLE }
    - { type: VARCHAR, size: (2**10)-1 }
  - - { type: DESCRIPTION }
    - { type: VARCHAR, size: MAX }
  - - { type: DATE }
    - { type: DATETIME }

tables:

  surveys:
    columns:
      survey_id: { C# Short Single: Id, type: ID }
      survey_title: { C# Short Single: Title, type: NAME }
      survey_author: { C# Short Single: Author, type: NAME }
      survey_description: { C# Short Single: Description, type: DESCRIPTION }
    constraints:
    - primary:
      - survey_id

  survey_pages:
    columns:
      survey_id: { C# Short Single: SurveyId, type: ID }
      survey_page_index: { C# Short Single: Index, type: INDEX }
      survey_page_title: { C# Short Single: Title, type: TITLE }
      survey_page_description: { C# Short Single: Description, type: DESCRIPTION }
    constraints:
    - primary:
      - survey_id
      - survey_page_index
    - foreign:
      - - survey_id
      - surveys:
        - survey_id

  answer_types:
    columns:
      answer_type_id: { C# Short Single: Id, type: ENUM }
      answer_type_name: { C# Short Single: Name, type: NAME }
    constraints:
    - primary:
      - answer_type_id

  survey_questions:
    columns:
      survey_id: { C# Short Single: SurveyId, type: ID }
      survey_page_index: { C# Short Single: PageIndex, type: INDEX }
      survey_question_index: { C# Short Single: Index, type: INDEX }
      survey_question_prompt: { C# Short Single: Title, type: TITLE }
      survey_question_answer_type: { C# Short Single: Type, type: ENUM }
    constraints:
