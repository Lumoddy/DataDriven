
replacements:

  column:

  - - type: ID
    - { type: INT }

  - - type: INDEX
    - { type: INT }

  - - type: TOKEN
    - type: BINARY
      size: 32
      default: >-
        = column.default === "RAND()"
            ? `CRYPT_GEN_RANDOM(32)`
            : column.default;

  - - type: ENUM
    - { type: TINYINT }

  - - type: BOOL
    - { type: BIT }

  - - type: NAME
    - { type: VARCHAR, size: = (2**8)-1 }

  - - type: HASH
    - { type: VARCHAR, size: = (2**8)-1 }

  - - type: TITLE
    - { type: VARCHAR, size: = (2**10)-1 }

  - - type: DESCRIPTION
    - { type: VARCHAR, size: MAX }

  - - type: DATE
    - { type: DATETIME }

  - - type: EXPIRY
    - type: DATETIME
      default: >-
        = "duration" in column
            ? `DATEADD(` +
                /^\s*\d+\s+(\w+?)s?\s*$/.exec(column.duration)[1].toUpperCase() +
                `, ` +
                /^\s*(\d+)\s+\w+\s*$/.exec(column.duration)[1] +
                `, GETDATE())`
            : null;

enums:

  survey_question_answer_types:
    short_plural: answer_types
    values:
      small_text:
      checkbox:
      radio:
      radio_or_other:
      multi_select:
      multi_select_and_other:

  survey_question_condition_operator:
    short_plural: condition_operator
    values:
      and:
      or:

  survey_question_show_condition_types:
    short_plural: show_condition_types
    values:
      has_answered:
      has_not_answered:

  survey_question_validation_condition_types:
    short_plural: validation_condition_types
    values:
      min:
      max:

  survey_question_condition_passing:
    short_plural: condition_passing
    values:
      failed:
      passed:
      undecided:

