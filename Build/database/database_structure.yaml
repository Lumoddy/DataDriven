
replacements:

  column:
  - - { type: ID }
    - { type: INT }
  - - { type: ENUM }
    - { type: TINYINT }
  - - { type: NAME }
    - { type: VARCHAR, size: 255 }
  - - { type: HASH }
    - { type: VARCHAR, size: 255 }
  - - { type: TITLE }
    - { type: VARCHAR, size: 1024 }
  - - { type: DESCRIPTION }
    - { type: VARCHAR, size: 65534 }

tables:

  surveys:
    columns:
      survey_id: { type: ID }
      name: { type: NAME }
      description: { type: DESCRIPTION }
    constraints:
    - primary:
      - survey_id

  survey_pages:
    columns:
      survey_id: { type: ID }
      survey_page_index: { type: INT }
      name: { type: TITLE }
      description: { type: DESCRIPTION }
    constraints:
    - unique:
      - survey_id
      - survey_page_index
    - foreign:
      - - survey_id
      - surveys:
        - survey_id

  survey_questions:
    columns:
      survey_id: { type: ID }
      survey_page_index: { type: INT }
      survey_question_index: { type: INT }
      prompt: { type: TITLE }
      answer_type: { type: ENUM }
    constraints:
    - unique:
      - survey_id
      - survey_page_index
      - survey_question_index
    - foreign:
      - - survey_id
        - survey_page_index
      - survey_pages:
        - survey_id
        - survey_page_index

  survey_question_conditions:
    columns:
      survey_id: { type: ID }
      survey_page_index: { type: INT }
      survey_question_index: { type: INT }
      other_survey_page_index: { type: INT }
      other_survey_question_index: { type: INT }
      condition: { type: VARCHAR, size: 255 }
    constraints:
    - unique:
      - survey_id
      - survey_page_index
      - survey_question_index
      - other_survey_page_index
      - other_survey_question_index
    - foreign:
      - - survey_id
        - survey_page_index
        - survey_question_index
      - survey_questions:
        - survey_id
        - survey_page_index
        - survey_question_index
    - foreign:
      - - survey_id
        - other_survey_page_index
        - other_survey_question_index
      - survey_questions:
        - survey_id
        - survey_page_index
        - survey_question_index

  survey_answers:
    columns:
      survey_id: { type: ID }
      survey_page_index: { type: INT }
      survey_question_index: { type: INT }
      submission_index: { type: INT }
      value: { type: VARCHAR, size: 4096 }
    constraints:
    - unique:
      - survey_id
      - survey_page_index
      - survey_question_index
      - submission_index
    - foreign:
      - - survey_id
        - survey_page_index
        - survey_question_index
      - survey_questions:
        - survey_id
        - survey_page_index
        - survey_question_index
    - foreign:
      - - survey_id
        - submission_index
      - submissions:
        - survey_id
        - submission_index

  answer_types:
    columns:
      answer_type: { type: ENUM }
      name: { type: NAME }
    constraints:
    - primary:
      - answer_type

  registered_members:
    columns:
      registered_member_id: { type: ID }
      phone_number: { type: VARCHAR, size: 12 }
      password_hash: { type: HASH }
      birth_date: { type: DATE }
      first_name: { type: NAME }
      last_name: { type: NAME }
    constraints:
    - unique:
      - registered_member_id

  survey_submissions:
    columns:
      survey_id: { type: ID }
      submission_index: { type: INT }
      registered_member_id: { type: INT }
    constraints:
    - unique:
      - survey_id
      - submission_index
      - registered_member_id
    - foreign:
      - - survey_id
        - submission_index
      - survey_submissions:
        - survey_id
        - submission_index
    - foreign:
      - - registered_member_id
      - registered_members:
        - registered_member_id