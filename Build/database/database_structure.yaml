replacements:
  - - { type: ID }
    - { type: INT, signed: false }
  - - { type: ENUM }
    - { type: TINYINT, signed: false }
tables:
  surveys:
    C# Plural: Surveys
    C# Single: Survey
    columns:
    - { name: survey_id, type: ID }
    - { name: name, type: VARCHAR, size: 255 }
    - { name: description, type: VARCHAR, size: 4095 }
    constraints:
    - primary: [survey_id]
  survey_pages:
    C# Plural: SurveyPages
    C# Single: SurveyPage
    columns:
    - { name: survey_id, type: ID }
    - { name: survey_page_index, type: INT, signed: false }
    - { name: name, type: VARCHAR, size: 1023 }
    - { name: description, type: VARCHAR, size: 4095 }
    constraints:
    - unique: [survey_id, survey_page_index]
    - foreign:
        from: [survey_id]
        surveys: [survey_id]
  survey_questions:
    C# Plural: SurveyQuestions
    C# Single: SurveyQuestion
    columns:
    - { name: survey_id, type: ID }
    - { name: survey_page_index, type: INT, signed: false }
    - { name: survey_question_index, type: INT, signed: false }
    - { name: question_text, type: VARCHAR, size: 4095 }
    - { name: answer_type, type: ENUM }
    constraints:
    - unique:
      - survey_id
      - survey_page_index
      - survey_question_index
    - foreign: 
        from:
        - survey_id
        - survey_page_index
        survey_pages:
        - survey_id
        - survey_page_index
  survey_answer_types:
    C# Plural: SurveyAnswerTypes
    C# Single: SurveyAnswerType
    columns:
    - { name: index, type: ENUM }
    - { name: name, type: VARCHAR, size: 255 }
    constraints:
    - primary: [index]
  survey_question_conditions:
    C# Plural: SurveyQuestionConditions
    C# Single: SurveyQuestionCondition
    columns:
    - { name: survey_id, type: ID }
    - { name: survey_page_index, type: INT, signed: false }
    - { name: survey_question_index, type: INT, signed: false }
    - { name: other_survey_page_index, type: INT, signed: false }
    - { name: other_survey_question_index, type: INT, signed: false }
    - { name: condition, type: VARCHAR, size: 1023 }
    constraints:
    - unique: [survey_id, survey_page_index, survey_question_index]
    - foreign: 
        from:
        - survey_id
        - survey_page_index
        - survey_question_index
        - other_survey_page_index
        - other_survey_question_index
        survey_questions:
        - survey_id
        - survey_page_index
        - survey_question_index
        - survey_page_index
        - survey_question_index
  registered_members:
    C# Plural: RegisteredMembers
    C# Single: RegisteredMember
    columns:
    - { name: registered_member_id, type: ID }
    - { name: password_hash, type: VARCHAR, size: 255 }
    - { name: birth_date, type: DATE }
    - { name: first_name, type: VARCHAR, size: 255 }
    - { name: last_name, type: VARCHAR, size: 255 }
    constraints:
    - primary: [registered_member_id]
  survey_answers:
    C# Plural: SurveyAnswers
    C# Single: SurveyAnswer
    columns:
    - { name: survey_id, type: ID }
    - { name: survey_page_index, type: INT, signed: false }
    - { name: survey_question_index, type: INT, signed: false }
    - { name: submission_index, type: INT, signed: false }
    - { name: condition, type: VARCHAR, size: 1023 }
    constraints:
    - unique: [survey_id, survey_page_index, survey_question_index]
    - foreign: 
        from:
        - survey_id
        - survey_page_index
        - survey_question_index
        survey_questions:
        - survey_id
        - survey_page_index
        - survey_question_index
    - foreign: 
        from: [submission_index]
        survey_questions: [submission_index]