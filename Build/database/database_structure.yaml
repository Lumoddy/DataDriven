
replacements:

  column:
  - - { type: ID }
    - { type: INT }
  - - { type: ENUM }
    - { type: TINYINT }
  - - { type: NAME }
    - { type: VARCHAR, size: (2**8)-1 }
  - - { type: HASH }
    - { type: VARCHAR, size: (2**8)-1 }
  - - { type: TITLE }
    - { type: VARCHAR, size: (2**10)-1 }
  - - { type: DESCRIPTION }
    - { type: VARCHAR, size: MAX }

tables:

  surveys:
    columns:
      survey_id: { C# Short Single: Id, type: ID }
      name: { type: NAME }
      description: { type: DESCRIPTION }
    constraints:
    - primary:
      - survey_id

  survey_pages:
    columns:
      survey_id: { type: ID }
      survey_page_index: { C# Short Single: PageIndex, type: INT }
      name: { type: TITLE }
      description: { type: DESCRIPTION }
    constraints:
    - unique:
      - survey_id
      - survey_page_index
    - foreign:
      - - survey_id
      - surveys:
        - survey_id

  survey_questions:
    columns:
      survey_id: { type: ID }
      survey_page_index: { C# Short Single: PageIndex, type: INT }
      survey_question_index: { C# Short Single: QuestionIndex, type: INT }
      prompt: { type: TITLE }
      answer_type: { type: ENUM }
    constraints:
    - unique:
      - survey_id
      - survey_page_index
      - survey_question_index
    - foreign:
      - - survey_id
        - survey_page_index
      - survey_pages:
        - survey_id
        - survey_page_index

  survey_question_conditions:
    columns:
      survey_id: { type: ID }
      survey_page_index: { C# Short Single: PageIndex, type: INT }
      survey_question_index: { C# Short Single: QuestionIndex, type: INT }
      other_survey_page_index: { C# Short Single: OtherPageIndex, type: INT }
      other_survey_question_index: { C# Short Single: OtherQuestionIndex, type: INT }
      condition: { type: VARCHAR, size: (2**8)-1 }
    constraints:
    - unique:
      - survey_id
      - survey_page_index
      - survey_question_index
      - other_survey_page_index
      - other_survey_question_index
    - foreign:
      - - survey_id
        - survey_page_index
        - survey_question_index
      - survey_questions:
        - survey_id
        - survey_page_index
        - survey_question_index
    - foreign:
      - - survey_id
        - other_survey_page_index
        - other_survey_question_index
      - survey_questions:
        - survey_id
        - survey_page_index
        - survey_question_index

  survey_answers:
    columns:
      survey_id: { type: ID }
      survey_page_index: { C# Short Single: PageIndex, type: INT }
      survey_question_index: { C# Short Single: QuestionIndex, type: INT }
      survey_submission_index: { type: INT }
      answer_value: { type: VARCHAR, size: (2**12)-1 }
    constraints:
    - unique:
      - survey_id
      - survey_page_index
      - survey_question_index
      - survey_submission_index
    - foreign:
      - - survey_id
        - survey_page_index
        - survey_question_index
      - survey_questions:
        - survey_id
        - survey_page_index
        - survey_question_index
    - foreign:
      - - survey_id
        - survey_submission_index
      - survey_submissions:
        - survey_id
        - survey_submission_index

  answer_types:
    columns:
      answer_type_id: { C# Short Single: Id, type: ENUM }
      name: { type: NAME }
    constraints:
    - primary:
      - answer_type_id

  registered_members:
    columns:
      registered_member_id: { C# Short Single: Id, type: ID }
      phone_number: { type: VARCHAR, size: 12 }
      password_hash: { type: HASH }
      birth_date: { type: DATETIME }
      first_name: { type: NAME }
      last_name: { type: NAME }
    constraints:
    - unique:
      - registered_member_id

  survey_submissions:
    columns:
      survey_id: { type: ID }
      survey_submission_index: { C# Short Single: Index, type: INT }
      registered_member_id: { type: INT, nullable: true }
    constraints:
    - unique:
      - survey_id
      - survey_submission_index
    - foreign:
      - - survey_id
        - survey_submission_index
      - survey_submissions:
        - survey_id
        - survey_submission_index
    - foreign:
      - - registered_member_id
      - registered_members:
        - registered_member_id